name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          cd taskbox
          npm ci

      - name: Build library
        run: |
          cd taskbox
          npx ng build ui-components

      - name: Publish to npm
        run: |
          cd taskbox/dist/ui-components
          npm publish --provenance --access public
